name: Generate note art

# Whenever 猪猪小记 content changes on main, draw a cute piglet comic for any
# post that doesn't have one yet (scripts/generate-note-art.mjs, gpt-image-2),
# commit the art + stamped notes.json, and kick the Pages deploy.
#
# Requires the repo Actions secret OPENAI_API_KEY whenever a note still needs
# art. The art commit is made with GITHUB_TOKEN, which cannot re-trigger this
# workflow (GitHub's recursion guard), so we dispatch both the deploy and any
# required continuation batch explicitly.

on:
  push:
    branches: ["main"]
    paths:
      - "content/notes.json"
      - "public/notes-art/**"
      - "scripts/generate-note-art.mjs"
      - "scripts/note-art-runtime.mjs"
      - "src/render-notes.js"
      - "src/note-markdown.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-note-art.yml"
  workflow_dispatch:
    inputs:
      force_slug:
        description: "Existing note slug to regenerate (blank generates missing art only)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: note-art
  queue: max

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate missing note art
        id: generate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTE_ART_FORCE_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.force_slug || '' }}
          NOTE_ART_SOURCE_MANIFEST: ${{ runner.temp }}/note-art-source-manifest.json
        run: node scripts/generate-note-art.mjs

      - name: Collect generated art for recovery
        id: recovery
        if: ${{ !cancelled() }}
        env:
          NOTE_ART_SOURCE_MANIFEST: ${{ runner.temp }}/note-art-source-manifest.json
        run: |
          recovery_dir="$RUNNER_TEMP/note-art-recovery"
          generated_files=()

          while IFS= read -r -d '' file; do
            [[ "$file" == *.webp ]] && generated_files+=("$file")
          done < <(
            git diff --name-only --diff-filter=AM -z -- public/notes-art
            git ls-files --others --exclude-standard -z -- public/notes-art
          )

          if (( ${#generated_files[@]} == 0 )); then
            echo "has_art=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$recovery_dir"
          for file in "${generated_files[@]}"; do
            cp --parents -- "$file" "$recovery_dir"
          done
          if [[ -s "$NOTE_ART_SOURCE_MANIFEST" ]]; then
            cp -- "$NOTE_ART_SOURCE_MANIFEST" \
              "$recovery_dir/note-art-source-manifest.json"
          fi
          echo "has_art=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated art recovery artifact
        if: ${{ !cancelled() && steps.recovery.outputs.has_art == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: note-art-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/note-art-recovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Commit art and redeploy
        if: ${{ success() && steps.generate.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE_ART_GENERATED_COUNT: ${{ steps.generate.outputs.generated_count }}
          NOTE_ART_SOURCE_MANIFEST: ${{ runner.temp }}/note-art-source-manifest.json
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/notes.json public/notes-art
            git commit -m "小记配图: auto-generate note art"

            for attempt in 1 2 3; do
              git fetch origin main

              if [[ "${NOTE_ART_GENERATED_COUNT:-0}" != "0" ]]; then
                if [[ ! -s "$NOTE_ART_SOURCE_MANIFEST" ]]; then
                  echo "::error::Generated art is missing its source fingerprint manifest; refusing an unverifiable push."
                  exit 1
                fi
                remote_notes="$RUNNER_TEMP/note-art-origin-main.json"
                git show origin/main:content/notes.json > "$remote_notes"
                node scripts/generate-note-art.mjs \
                  --verify-source-manifest \
                  "$NOTE_ART_SOURCE_MANIFEST" "$remote_notes" "$NOTE_ART_GENERATED_COUNT"
              fi

              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Generated art conflicts with newer content on main. Recover the exact WebP from this run's note-art-recovery artifact."
                exit 1
              fi

              if [[ "${NOTE_ART_GENERATED_COUNT:-0}" != "0" ]]; then
                npm ci --ignore-scripts --no-audit --no-fund
                node scripts/generate-note-art.mjs \
                  --verify-source-manifest \
                  "$NOTE_ART_SOURCE_MANIFEST" content/notes.json "$NOTE_ART_GENERATED_COUNT" \
                  --require-image-reference
              fi

              if push_output="$(git push origin HEAD:main 2>&1)"; then
                echo "$push_output"
                break
              else
                push_status=$?
              fi

              echo "$push_output"

              if [[ "$push_output" != *"(fetch first)"* && "$push_output" != *"non-fast-forward"* ]]; then
                exit "$push_status"
              fi

              if (( attempt == 3 )); then
                echo "::error::main kept advancing; stopped after 3 safe push attempts. Recover the exact WebP from this run's note-art-recovery artifact."
                exit "$push_status"
              fi

              echo "main advanced during push; retrying safely ($attempt/3)."
            done

            gh workflow run deploy-pages.yml --ref main
            if [[ "${{ steps.generate.outputs.needs_followup }}" == "true" ]]; then
              gh workflow run generate-note-art.yml --ref main
            fi
          else
            echo "No new art to commit."
          fi

      - name: Surface generation failures
        if: ${{ !cancelled() && steps.generate.outcome == 'failure' }}
        run: |
          echo "::error::One or more note-art operations failed. See the job summary and recovery artifact."
          exit 1
