name: Generate note art

# Whenever 猪猪小记 content changes on main, draw a cute piglet comic for any
# post that doesn't have one yet (scripts/generate-note-art.mjs, gpt-image-2),
# commit the art + stamped notes.json, and kick the Pages deploy.
#
# Requires the repo Actions secret OPENAI_API_KEY. Without it the run is a
# clearly-logged no-op, so the workflow is safe to merge before the secret
# exists. The art commit is made with GITHUB_TOKEN, which cannot re-trigger
# this workflow (GitHub's recursion guard), so we dispatch the deploy
# workflow explicitly.

on:
  push:
    branches: ["main"]
    paths: ["content/notes.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: note-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Generate missing note art
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-note-art.mjs

      - name: Commit art and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/notes.json public/notes-art
            git commit -m "小记配图: auto-generate note art"
            git push
            gh workflow run deploy-pages.yml --ref main
          else
            echo "No new art to commit."
          fi
