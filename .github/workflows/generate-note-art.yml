name: Generate note art
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify both approved source notes without generating images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {sceneInput, requestNoteScene, buildArtPrompt} from './scripts/generate-note-art.mjs';
          const {notes} = JSON.parse(await readFile('content/notes.json', 'utf8'));
          for (const slug of ['2026-08-15', '2026-08-28']) {
            const input = sceneInput(notes.find(n => n.slug === slug));
            assert.equal(input.roster.residents.length, 15);
            assert.equal(input.roster.guests.length, 2);
            assert.ok(input.markers.includes('小猪'));
            const scene = await requestNoteScene({input, apiKey: process.env.OPENAI_API_KEY});
            const prompt = buildArtPrompt(scene, input);
            assert.ok(prompt.includes(scene.sourceExcerpt));
            assert.ok(['single', 'panels'].includes(scene.layout));
            console.log('Verified plan', JSON.stringify({slug, layout:scene.layout, cast:scene.cast, start:input.body.indexOf(scene.sourceExcerpt), length:scene.sourceExcerpt.length}));
          }
          JS
